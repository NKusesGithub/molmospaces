vehicle:
  name: holybro_x650
  frame: quad_x
  mass_kg: 2.0                  # Holybro full-kit mass, battery excluded
  inertia_kg_m2: [0.085, 0.085, 0.160]  # placeholder; measure before tuning
  center_of_mass_m: [0.0, 0.0, 0.0]
  nominal_wheelbase_m: 0.650
  visual_asset: ../usd/holybro_x650.usda

simulation:
  up_axis: Z
  linear_units: metres
  gravity_m_s2: 9.80665
  collision_model: proxy

px4:
  interface: configure_for_selected_bridge
  airframe: quad_x
  motor_order: verify_against_px4_airframe
  rotor_spin_directions: verify_against_physical_x650
  thrust_model: calibrate_from_motor_prop_bench_data
